name: Job Search Digest

on:
  schedule:
    # Once a day, ~8am US Eastern (drifts to ~7am during EST since cron is
    # UTC and doesn't follow daylight saving). The script's own recency
    # filter (config.MAX_POSTING_AGE_HOURS, default 48h) means a daily
    # check comfortably never misses anything. Adjust to taste.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m job_search_bot.main --quiet

      - name: Persist seen-jobs cache
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f seen_jobs.json
          # seen_jobs.json is in .gitignore for local dev convenience, but
          # that means `git status <path>` silently omits it here too
          # (ignored files are excluded from status by default even when
          # named explicitly) -- checking the *staged diff* after a forced
          # add works regardless of the ignore rule.
          if git diff --cached --quiet -- seen_jobs.json; then
            echo "No change to seen_jobs.json"
          else
            git commit -m "Update seen-jobs cache [skip ci]"
            git push
          fi
